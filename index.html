      /* পটভূমি: হালকা সবুজাভ, গাঢ় সবুজ হেডারের সাথে মানানসই — সাদা কার্ড এখানে আলাদা করে দেখায় */

        font-family: 'Hind Siliguri', system-ui, -apple-system, 'Segoe UI', sans-serif;
        min-height: 100%;
        background: radial-gradient(1100px 520px at 50% -180px, #CDEBDD, transparent 70%), #E6F3EC;
        color: #15241D;
      }
      .font-display { font-family: 'Baloo Da 2', 'Hind Siliguri', system-ui, sans-serif; letter-spacing: 0; }
      .tabular-nums { font-variant-numeric: tabular-nums; }
      input[type=number]::-webkit-inner-spin-button { opacity: .4; }
