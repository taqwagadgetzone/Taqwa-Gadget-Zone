name: Deploy stock app to Hostinger

# main-এ push হলে অটো build হয়ে stock.taqwagadgetzone.com-এ FTP দিয়ে আপলোড হবে।
# প্রয়োজনীয় GitHub Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stock-app
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Guard — শুধু stock সাইটের FTP অ্যাকাউন্টে আপলোড হবে
        # মূল সাইট taqwagadgetzone.com রক্ষার জন্য: FTP_USERNAME stock অ্যাকাউন্ট না হলে deploy বন্ধ।
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          if [ "$FTP_USERNAME" != "u459732638.stock.taqwagadgetzone.com" ]; then
            echo "FTP_USERNAME stock অ্যাকাউন্টের সাথে মেলে না। মূল সাইট রক্ষায় deploy বন্ধ করা হলো।"
            exit 1
          fi

      - name: Upload dist to Hostinger over FTP
        # clean-slate বন্ধ রাখা হয়েছে: সার্ভারের steadfast.php ও অন্য ফাইল মুছবে না।
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: public_html/
